<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой Мессенджер</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e; color: #eee;
      max-width: 480px; margin: 0 auto;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #16213e; padding: 14px; text-align: center;
      font-size: 18px; font-weight: bold; color: #e94560;
    }
    #chat {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg {
      background: #16213e; padding: 8px 12px; border-radius: 12px;
      max-width: 85%; word-wrap: break-word;
    }
    .msg.me { align-self: flex-end; background: #0f3460; }
    .name { font-weight: bold; color: #e94560; font-size: 13px; }
    .time { font-size: 11px; color: #888; }
    footer {
      background: #16213e; padding: 10px;
      display: flex; gap: 8px;
    }
    input {
      flex: 1; padding: 10px; border: none; border-radius: 8px;
      background: #1a1a2e; color: #eee; font-size: 15px;
    }
    button {
      padding: 10px 18px; border: none; border-radius: 8px;
      background: #e94560; color: white; font-size: 15px;
      cursor: pointer; white-space: nowrap;
    }
    #nameBar {
      background: #16213e; padding: 8px 12px;
      display: flex; align-items: center; gap: 8px;
    }
    #nameBar label { font-size: 14px; color: #888; }
    #nameInput {
      flex: 1; padding: 6px 10px; border: none; border-radius: 6px;
      background: #1a1a2e; color: #eee; font-size: 14px;
    }
  </style>
</head>
<body>
  <header>💬 Мой Мессенджер</header>

  <div id="nameBar">
    <label>Имя:</label>
    <input id="nameInput" placeholder="Введи своё имя" maxlength="20">
  </div>

  <div id="chat"></div>

  <footer>
    <input id="text" placeholder="Сообщение..." maxlength="200"
           onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">➤</button>
  </footer>

  <script>
    let lastCount = 0;

    async function load() {
      try {
        const r = await fetch("/api/messages");
        const msgs = await r.json();
        if (msgs.length !== lastCount) {
          lastCount = msgs.length;
          const myName = document.getElementById("nameInput").value;
          const chat = document.getElementById("chat");
          chat.innerHTML = msgs.map(m => {
            const cls = m.name === myName ? "msg me" : "msg";
            return `<div class="${cls}">
              <span class="name">${escapeHtml(m.name)}</span>
              <span class="time"> ${m.time}</span><br>
              ${escapeHtml(m.text)}
            </div>`;
          }).join("");
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (e) {}
    }

    async function send() {
      const name = document.getElementById("nameInput").value.trim() || "Аноним";
      const text = document.getElementById("text").value.trim();
      if (!text) return;
      await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, text })
      });
      document.getElementById("text").value = "";
      load();
    }

    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    document.getElementById("nameInput").value = localStorage.getItem("name") || "";
    document.getElementById("nameInput").oninput = () => {
      localStorage.setItem("name", document.getElementById("nameInput").value);
    };

    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
