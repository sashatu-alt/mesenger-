<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Messenger</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    #reg-form, #chat { max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #fff; }
    .msg { margin: 5px 0; padding: 6px 10px; border-radius: 4px; background: #eef; }
    .mine { background: #dff; align-self: flex-end; text-align: right; }
  </style>
</head>
<body>
  <div id="reg-form">
    <h2>Зарегистрируйтесь</h2>
    <input id="username" placeholder="Имя пользователя" required>
    <input id="password" type="password" placeholder="Пароль" required>
    <button id="reg-btn">Зарегистрироваться</button>
  </div>

  <div id="chat" style="display:none;">
    <h2>Чат</h2>
    <div id="messages"></div>
    <input id="message" placeholder="Сообщение">
    <button id="send">Отправить</button>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const regForm = document.getElementById('reg-form');
    const chat = document.getElementById('chat');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message');
    const sendBtn = document.getElementById('send');
    const regBtn = document.getElementById('reg-btn');

    if (token) {
      regForm.style.display = 'none';
      chat.style.display = 'block';
      initChat(token);
    }

    regBtn.addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('Заполните все поля');
      const res = await fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error || 'Ошибка регистрации');
      localStorage.setItem('token', data.token);
      regForm.style.display = 'none';
      chat.style.display = 'block';
      initChat(data.token);
    });

    function initChat(token) {
      const ws = new WebSocket(`ws://\${location.host}`);
      ws.onopen = () => ws.send(JSON.stringify({ type: 'authenticate', token }));
      ws.onmessage = event => {
        const msg = JSON.parse(event.data);
        const div = document.createElement('div');
        div.className = `msg \${msg.username === localStorage.getItem('username') ? 'mine' : ''}`;
        div.textContent = `${msg.username}: ${msg.text}`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      };
      sendBtn.addEventListener('click', () => {
        const text = messageInput.value.trim();
        if (!text) return;
        ws.send(JSON.stringify({ type: 'message', text }));
        messageInput.value = '';
      });
      messageInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') sendBtn.click();
      });
    }
  </script>
</body>
</html>
